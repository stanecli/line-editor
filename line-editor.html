<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Line editor</title>
    <link rel="stylesheet" href="./line-editor.css">
  </head>
  <body>
    <div id="stage" aria-label="Line editing area"></div>

    <!-- Global settings are always visible. Selection reveals line settings. -->
    <div id="config" class="panel">
      <h2>Global settings</h2>
      <label>
        Selection color
        <input id="selectionColor" type="color" value="#e78220">
      </label>
      <label>
        Outline thickness
        <input id="outline" type="range" min="1" max="10" value="3">
        <output id="outlineValue" for="outline">3</output>
      </label>
      <label>
        Handle size
        <input id="handleSize" type="range" min="10" max="100" value="24">
        <output id="handleSizeValue" for="handleSize">24</output>
      </label>

      <div id="lineSettings" hidden>
        <hr>
        <h2>Line settings</h2>
        <label>
          Width
          <input id="width" type="range" min="1" max="20" value="8">
          <output id="widthValue" for="width">8</output>
        </label>
        <label>
          Color
          <input id="color" type="color" value="#497be8">
        </label>
        <label>
          Opacity
          <input id="opacity" type="range" min="0" max="100" value="100">
          <output id="opacityValue" for="opacity">100%</output>
        </label>
      </div>
    </div>

    <!-- Layers are listed from front to back. -->
    <div id="tools" class="panel">
      <button id="add" type="button">＋ Add line</button>
      <h2 class="layers-heading">Layers</h2>
      <div class="layers-description">
        Top layer appears in front. Drag ⠿ to reorder.
      </div>
      <ul id="layers"></ul>
    </div>

    <div class="hint">
      Drag endpoints · Click a line to select · Click empty space to deselect
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
